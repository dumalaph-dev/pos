name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      # Pinned to commit SHAs, not tags. A tag is mutable: `@v7` resolves to
      # whatever that major currently points at, which means arbitrary new code
      # runs on every push to a repository that handles payments. The trailing
      # comment is the human-readable version — update both together, and
      # re-resolve the SHA from the tag rather than editing it by hand.
      #
      # These are on v7 because v4 shipped a Node 20 entrypoint that the runners
      # already force onto Node 24 with a deprecation warning; v5 was the first
      # major on Node 24.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-version tracks the local toolchain (v22.13.1) rather than the
      # action's own runtime, so it stays at 22.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
