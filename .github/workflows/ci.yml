name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      # v4 of both actions ships a Node 20 entrypoint. GitHub already forces
      # those onto Node 24 and warns; the warning becomes a hard failure when
      # Node 20 support is removed from the runners. v5 was the first major on
      # Node 24 — these are on the current major so the bump is not due again
      # in a few months.
      - name: Check out repository
        uses: actions/checkout@v7

      # node-version tracks the local toolchain (v22.13.1) rather than the
      # action's own runtime, so it stays at 22.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
